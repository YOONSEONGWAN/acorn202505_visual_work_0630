<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step14_promise.html</title>
</head>
<body>
    <script>
        // 기상하는 함수
        function wakeUp(callback){
            // 기상을 완료한 후에 
            // callback 함수를 호출한다.
            setTimeout(()=>{
            console.log("1. 기상 완료");
            callback();}, 1000);
        }

        // 밥 먹는 함수
        function eatBreakfast(){

        }
        
        // 학교 가는 함수 
        function goToSchool(){

        }

        // 순서대로 해야 한다.
        /*wakeUp();
        eatBreakfast();
        goToSchool();*/
        // 자바스크립트 특성상 비동기 동작이 많다. 
        // 반드시 동작이 끝나고 해야 하는 경우에도
        // 최대 빠르기로 위에서부터 다 호출하는 경우가 많다. 호출은 순서대로 하더라도 끝나는 순서를 보장할 순 없다. 
        // 순서를 보장 하려면 동작이 끝나고 호출해야 한다. 

        // --->>>
        wakeUp(()=>{
            eatBreakfast();
        });
    </script>
</body>
</html>
