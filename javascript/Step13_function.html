<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step13_function.html</title>
</head>
<body>
    <h1> 다양한 모양의 함수</h1>
    <script>
        // 함수의 매개변수를 선언할 때 default 값을 지정할 수 있다.
        function showInfo (num=0, name="누구게", addr="어디게" ){
            console.log(`num:${num} name:${name}, addr:${addr}`);

        }
        showInfo(1, "김구라", "노량진");
        showInfo();

        // ... 변수명은 rest parameter 를 의미한다.
        function printMsgs(...args){
            console.log(args);
        }
        printMsgs();
        printMsgs("hi");
        printMsgs("hi", "hello", "bye");
        // args는 배열로 나타난다. 하나만 넣으면 하나가 들어가는 배열 

        // object 안에 함수
        const myObj = {
            num:1, // 함수가 아니라 호출은 못하고 참조만 가능
            action:function(){
                console.log("어떤 동작을 수행합니다!");
                // 함수는 참조도 할 수 있고 myObj.action(); 으로 호출도 바로 할 수 있다.
            }
        };

        const yourObj={
            num:2, // 키 콜론 밸류 컴마
            action(){
                console.log("어떤 동작을 수행합니다!");
            }, // function을 생략하고 줄여서 사용할 수 있다
            fly(){
                console.log("날아 다녀요!");
            }
        }

    </script>
</body>
</html>
